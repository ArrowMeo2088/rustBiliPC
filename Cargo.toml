[package]
name = "rustbilipc"
version = "0.1.0"
edition = "2021"
description = "Bilibili 桌面客户端（Rust + GPUI，Windows x64，零浏览器技术）"
# 本机不装 Rust 工具链，只有 CI 会构建；发布配置见 [profile.release]。
publish = false

[dependencies]
# GPUI 生态的唯一入口：umbrella crate 自带 `use gpui_kit::*`（gpui 在其根上），
# 应用侧不单独声明 gpui，gpui-pre 的 =0.3.9 精确 pin 由 kit 自己携带 + 我们的 Cargo.lock 锁定。
# default features = ["component", "assets"]，实测不含 webview，符合零浏览器要求。
gpui-kit = "0.8.0"

# Bilibili Web API 封装。关掉默认的 full（27 个模块），只开当前四个阶段需要的。
# 后续阶段按 docs/api-notes.md 的记录再增列（如 danmaku 会多拉 quick-xml + flate2）。
# "misc" 只为 `misc().buvid()`（/x/frontend/finger/spi）：扫码登录的响应 cookie 里通常
# 没有 buvid3，而 `Account::validate_complete` 要四个字段齐全，缺它就没法 set_account。
bpi-rs = { version = "0.3.1", default-features = false, features = [
    "login",
    "search",
    "video",
    "user",
    "fav",
    "historytoview",
    "misc",
] }

# bpi-rs 基于 reqwest，poll 其 future 必须在有 tokio reactor 的环境里进行；
# gpui 的执行器不是 tokio，所以我们在 src/app.rs 里自建 runtime 并做桥接。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
# 日志自己实现（写 debug.log + stderr），见 src/logging.rs：GUI 程序没有控制台。
# 这里原本有 `which`（在 PATH 里找 mpv）。第十八轮真机证明那条路本身是错的：
# PATH 先命中控制台版 mpv.com（PATHEXT 把 .COM 排在 .EXE 前），而它会再派生一个 mpv.exe，
# 我们 kill 的只是外层启动器。现在只认运行目录的 mpv.exe，见 src/player/mod.rs 文件头。
# 扫码登录要把 B 站给的 URL 变成模块矩阵。只要纯矩阵（`to_matrix()`），
# 关掉默认的 image/svg/pic 渲染后端：那三个会拉进 pixels 版 `image`，与 gpui 用的
# 同名 fork（`use image::Frame`）混在一个构建里容易出问题。二维码直接用 div 网格画。
qrcode-generator = { version = "6.1", default-features = false, features = ["std", "qr"] }
# 只为在启动时装一次进程级 rustls crypto provider（依赖图里 aws-lc-rs 与 ring 同时启用，
# 不装会在 TLS 握手处 panic）。版本由 Cargo.lock 与 bpi-rs 统一，不额外引入实现。
rustls = "0.23"
# gpui 的默认 HttpClient 是 NullHttpClient（请求直接失败），网络封面图必须换成真客户端。
# 与 kit 的 pin 保持同一个 =0.3.9 快照，避免多一份 gpui。
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }

[lints.rust]
# 裸 `cx.spawn(...)` 丢掉返回的 `Task` = 任务立即被取消（真机表现：请求发出去了、界面永远不动，
# 见 docs/architecture.md 第 4.9 节）。gpui 的 `Task` 是 `#[must_use]`，这里把该警告升级为错误。
unused_must_use = "deny"

[profile.release]
# 按定稿：现阶段不做 LTO、不 strip，优先编译速度与可排查性。
lto = "off"
strip = false
codegen-units = 16
# 保留 PDB/调试符号：release 崩溃时 CI 日志里才看得出行号。
debug = true
