name: CI

# 推送就跑的**快速验证**：只做 Windows x64 release 编译 + 单测，不压缩、不发 release。
# 2026-10-26（P13）从原来的单个 `build.yml` 拆成两份：这份管"改动是否还能编过"，
# `.github/workflows/cd.yml` 管"优化 + UPX + 发 GitHub Release"（手动触发、多平台）。
#
# 为什么这份只编 win-x64：本项目**本机没有 Rust 工具链**（QODER.md 第一条），
# 每一轮改动都要靠 CI 才有编译证据；多平台矩阵一次要 20 分钟以上，
# 放在 push 触发的那一条路上只会让人不敢推。多平台留给 cd.yml。
#
# 为什么仍然只 release 不 debug：gpui 的 Windows 后端在 debug 下**运行时**从编译机路径读 HLSL，
# 产物不可移植（docs/architecture.md 第 2 节）。
#
# 为什么不加 `--locked`：Cargo.lock 在这里只当"版本种子"用（cargo 沿用它已记录的版本，
# 只为新依赖解析）。加了 `--locked` 后任何一次新增依赖都会先把 CI 卡死，而本机没有 cargo
# 没法预先刷新 lock。每轮把 lock 作为 artifact 取回来入库，所以仍然有 diff 可查。
#
# **推送前先跑 `python .github/scripts/check_workflows.py`**（2026-10-27）：它专抓
# `yaml.safe_load` 抓不到、GitHub 又不一定报错的那几类——重复键、`needs` 指向不存在的作业、
# 未声明的 `inputs.*`、矩阵 `include` 各项键不一致，尤其是 **`steps.<id>.*` 指到一个没写 `id:`
# 的步骤**（那条求值为空串、不报错，第五十二轮的三次红就是它：作业输出永远为空 → 下游
# `fromJson(空)` 得到零条矩阵腿 → 那个作业在作业列表里直接不出现，日志零错误）。
#
# **`paths-ignore`（2026-10-27 用户定稿）**：纯文档与 `cd.yml` 那一组文件的提交**不再重编**。
# 理由：一轮的"文档同步"是规矩（改了哪个目录就同一提交更新它的 README/docs），
# 但一次提交里全是 `.md` 时编译证据与上一版一模一样——第五十二轮就因为这一点连烧三次 CI。
# 三条口径要记牢：
# ① **`ci.yml` 自己不在 ignore 里**：动它就跑一轮，至少证明构建没被谁改坏
#    （但它自己的 YAML 语法错误只有 GitHub 报，这一条挡不住）；
# ② 只要同一次提交**还带了代码**，ignore 不生效、照常全量编译（这是"提交里有没有源码"的判据，
#    不是"文档单独提交"的判据）；
# ③ `Cargo.toml` / `Cargo.lock` / `.rs` 一律不在 ignore 里，改依赖必然要编译。

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "QODER.md"
      - ".github/workflows/cd.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "QODER.md"
      - ".github/workflows/cd.yml"
  # 保留手动入口：想在没改动时也验一轮（比如刚换过 runner 镜像），
  # 或某轮全是文档却仍想要一次编译证据时，直接 dispatch。
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/同一事件只要留最新一次：**第五十二轮连着推了三个提交，CI 就并排起了三个作业，
# 而三次编的是同一份源码**（后两个只改 `cd.yml`）。`paths-ignore` 挡掉"全是文档"的那一类，
# 这一条挡掉"短时间内连推"的那一类。分组带上事件名，避免 push 把同 ref 的 PR 检查顶掉。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # aws-lc-sys（rustls 0.23 默认 provider）在 MSVC 上要汇编器；runner 自带 CMake。
      - name: Install NASM (for aws-lc-sys on MSVC)
        run: choco install nasm --no-progress -y

      # release 编译期 gpui 的 build.rs 要用 fxc.exe 编 HLSL，找不到就 panic。
      - name: Locate fxc.exe (gpui compiles HLSL at build time in release)
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem -Path $sdk -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'x64' } |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1
          if ($fxc) {
            "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "fxc: $($fxc.FullName)"
          } else {
            "fxc.exe 未找到；gpui 的 build.rs 会自行搜索，若失败请检查 Windows SDK"
          }

      # key 只按 Cargo.lock：把 workflow/Cargo.toml 混进 hash 会让"改一行 CI"就缓存全失效。
      # save-always 必需：首轮失败时 post 步骤不执行、缓存没写盘，下一次又得全量重编。
      - name: Cache cargo home and target
        uses: actions/cache@v4
        with:
          save-always: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            C:/Users/runneradmin/.cargo/registry
            C:/Users/runneradmin/.cargo/git
            target
          key: cargo-win-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-win-${{ runner.os }}-release-

      - name: Build (release)
        shell: bash
        run: cargo build --release

      # 交付口径是"N passed / 零 warning"，所以这里单独跑一次 check 把 warning 数出来：
      # `cargo build` 命中缓存时**不会重复报**旧的 warning，只有 `--message-format=json` 重新
      # 过一遍前端才数得准。
      # 第五十五轮的教训：`link.exe` 不认 `/ICON:` 时只丢一句 `LNK4044 … ignored`，
      # 编译照绿、产物照没图标。**光看编译成不成功查不出这件事**，所以直接扫二进制。
      # 这一条放在 ci.yml 而不是 cd.yml：日常这条快、红了立刻知道；发布那条只写 summary（不为图标卡发布）。
      - name: Verify the exe carries its icon
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python .github/scripts/check_icon.py target/release/rustbilipc.exe

      - name: Test (pure logic only, no window needed)
        shell: bash
        run: cargo test --release

      # 交付口径是"N passed / **零 Rust warning** / Cargo.lock 零差异"，
      # 而 `cargo build` 命中缓存时**不会重复报**上一轮已经修掉的 warning。
      # 所以再用 `cargo check --tests` 强制前端重新过一遍并数出 warning 条数写进日志
      # （第四十二轮就是这么确认"零 warning"的，第四十六轮沿用）。
      - name: Count Rust warnings (delivery bar is zero)
        if: always()
        shell: bash
        run: |
          cargo check --release --all-targets --message-format=json > check-messages.json 2>/dev/null || true
          count=$(grep -c '"level":"warning"' check-messages.json 2>/dev/null || echo 0)
          echo "### Rust warning 条数：$count" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning::本轮有 $count 条 Rust warning（交付口径是零）"
            grep '"level":"warning"' check-messages.json | head -20
          fi

      # 交付用的 exe：**只打包这一个文件**（不带 dll、不带 mpv）。
      # `cd.yml` 那份是"优化 + UPX + Release"，这一份是"这一轮改动的现场产物"，
      # 他日常真机验证取的就是这里。
      - name: Upload Windows x64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustbilipc-win-x64-release
          path: target/release/rustbilipc.exe
          if-no-files-found: error

      - name: Upload Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-ci
          path: Cargo.lock
          if-no-files-found: ignore
