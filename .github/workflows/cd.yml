name: CD

# 手动触发的**发布**流水线：四个平台同时编（一条作业 + 静态 `include` 矩阵，`fail-fast: false`，
# 一个目标红不带走其余三个），用 `[profile.release-dist]`（LTO / codegen-units=1 / strip）编，
# UPX 压，**资产只有可执行文件**——不塞 dll、不塞 mpv、不塞 README
# （用户定稿："注意只需要打包 exe，不要打包其他东西"；本项目本来就是单 exe + 外置 mpv.exe）。
# 形状照 `ref/ocfree/workflows/cd.yml` 抄：矩阵写死在文件里，**不要 `plan` 作业、不要 `fromJson`**
# （第五十二轮为"按输入挑目标"绕了一圈动态矩阵，红三次，真因是我自己漏写步骤 `id`，见架构第 8 节）。
#
# `publish` 默认关：这一条第一件事是**量真实体积**（`release-dist` + UPX 那四份取回来就行），
# 建 Release 是公开动作，要点头。四个目标里只有 win-x64 是 `ci.yml` 天天在跑的，
# 另三条一次都没真跑过（runner 标签、系统库齐不齐都没证据 —— 风险清单第 31 条）。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "把这四份 exe 发成 GitHub Release（关掉 = 只编译取产物，不动 Release）"
        type: boolean
        required: false
        default: false
      tag:
        description: "Release 的 tag（比如 v0.1.0），publish=true 时必填"
        type: string
        required: false
        default: "v0.1.0"
      prerelease:
        description: "标成预发布（prerelease）"
        type: boolean
        required: false
        default: true
      replace_tag:
        description: "同名标签已存在且不在本次提交上时，删掉旧 release 与标签重建"
        type: boolean
        required: false
        default: false
      upx:
        description: "用 UPX 压缩（--lzma --best）"
        type: boolean
        required: false
        default: true

# `contents: write` 是 `release` 作业要的（建 release、传资产）。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # UPX 版本钉死：`choco install upx` 给的是"当时最新"，某天换个版本压出来的东西不一样。
  # Windows 用官方 zip（choco 那条路也留着当回退），Linux 用 apt 的包——**不能**在 arm64 runner 上
  # 解压 amd64 的 UPX，那是跑不起来的。
  UPX_VERSION: 5.2.1

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: rustbilipc.exe
            asset: rustbilipc-win-x64.exe
            windows: true
            # aws-lc-sys 在 MSVC 上要 NASM（第五十一轮查明它随 quinn-proto 进来、去不掉）。
            nasm: true
            # gpui 的 build.rs 在 release 下要 fxc.exe 编 HLSL，只有 Windows 目标需要探它。
            need_fxc: true

          - rid: win-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            exe: rustbilipc.exe
            asset: rustbilipc-win-arm64.exe
            windows: true
            nasm: true
            need_fxc: true

          - rid: linux-x64
            # 钉 22.04 而不是 ubuntu-latest：Linux 产物链的是 runner 本机 glibc，
            # 24.04（glibc 2.39）编出来的二进制拿到老系统会报 `GLIBC_2.39 not found`。
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: rustbilipc
            asset: rustbilipc-linux-x64
            windows: false
            nasm: false
            need_fxc: false

          - rid: linux-arm64
            # 用 ARM 型 Linux runner，而不是在 x86 runner 上交叉编译：gpui 的 Linux 后端要链接
            # 一串系统库（X11/wayland/fontconfig/ALSA/vulkan），交叉得先搭一个带这些 .so 与头文件的
            # arm64 sysroot，比直接用 arm runner 贵得多。这个标签存在与否**也还没验过**。
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: rustbilipc
            asset: rustbilipc-linux-arm64
            windows: false
            nasm: false
            need_fxc: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NASM (for aws-lc-sys on MSVC)
        if: matrix.nasm
        shell: bash
        run: choco install nasm --no-progress -y

      # gpui 的 Linux 后端要 X11/wayland/fontconfig/ALSA/vulkan 这些开发包；包名按 gpui 自己 CI 那份列
      # （缺一个就是 link 阶段一大串 undefined）。
      # **第五十三轮补的 `libxkbcommon-x11-dev`**：两条 Linux 目标第一次跑就在链接期报
      # `cannot find -lxkbcommon-x11`——那份包列表里没有它（x64 走 rust-lld、arm64 走 /usr/bin/ld，
      # 报的是同一个库），不是 gpui 不支持 Linux，是少装一个 -dev 包。
      - name: Install Linux system dependencies
        if: ${{ !matrix.windows }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev \
            libclang-dev libvulkan1 libfontconfig1-dev libexpat1-dev \
            fonts-noto-color-emoji libwayland-dev wayland-protocols \
            libxcursor-dev libxcb1-dev pkg-config

      # gpui 的 build.rs 在 release 下要编译 HLSL 着色器，需要 Windows SDK 里的 fxc.exe。
      # 找不到时只提示、不挡住：gpui 的 build.rs 自己也会搜一遍（第四轮起就这么活的）。
      - name: Locate fxc.exe (gpui compiles HLSL at build time in release)
        if: matrix.need_fxc
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem -Path $sdk -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'x64' } |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1
          if ($fxc) {
            "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "fxc: $($fxc.FullName)"
          } else {
            "fxc.exe 未找到；gpui 的 build.rs 会自行搜索，若失败请检查 Windows SDK"
          }

      - name: Cache cargo home and target
        uses: actions/cache@v4
        with:
          save-always: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            C:/Users/runneradmin/.cargo/registry
            C:/Users/runneradmin/.cargo/git
            target
          key: cargo-${{ matrix.rid }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.rid }}-

      # `release-dist` 是 Cargo.toml 里为发布单独加的配置：LTO + codegen-units=1 + strip + 无 debug 信息。
      # **不写 `panic = "abort"`**：`app::describe_join_error` 靠 tokio 把任务 panic 变成 `JoinError`
      # 才能把崩溃原因说给人看。输出目录是 `target/<triple>/release-dist/`。
      - name: Build (release-dist, ${{ matrix.target }})
        shell: bash
        run: cargo build --profile release-dist --target ${{ matrix.target }}

      - name: Install UPX (Windows)
        if: ${{ inputs.upx && matrix.windows }}
        shell: pwsh
        run: |
          $v = $env:UPX_VERSION
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v$v/upx-$v-win64.zip" -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx -Force
          "$PWD/upx/upx-$v-win64" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install UPX (Linux)
        if: ${{ inputs.upx && !matrix.windows }}
        # arm64 上的 `upx` 包在某些源里叫 `upx-ufl`（免费版），装不上就退一份。
        run: sudo apt-get update && (sudo apt-get install -y upx || sudo apt-get install -y upx-ufl)

      - name: Compress with UPX
        if: inputs.upx
        shell: bash
        run: |
          set -u
          bin="target/${{ matrix.target }}/release-dist/${{ matrix.exe }}"
          if [ ! -f "$bin" ]; then echo "找不到产物：$bin"; exit 1; fi
          before=$(wc -c < "$bin")
          summary="压缩前 $before 字节"
          # 不覆盖原文件：先压到临时名，成功了才换回去（压失败时至少还有一个能用的 exe）。
          # UPX 对 PE/ARM64 与 ELF/ARM64 都支持，但 **Rust 产物压缩后偶尔会在运行期出问题**，
          # 所以这一步失败不挡住发布：未压缩的那一份照样出。
          if upx -9 --lzma "$bin" -o "$bin.upx"; then
            mv "$bin.upx" "$bin"
            after=$(wc -c < "$bin")
            pct=$(awk -v a="$after" -v b="$before" 'BEGIN{printf "%.1f", a*100/b}')
            echo "UPX：$before → $after 字节（原体积的 $pct%）"
            summary="UPX 完成：$before → $after 字节（$pct%）"
          else
            echo "UPX 失败，交付未压缩的那一份（$before 字节）"
            summary="UPX 失败，交付未压缩那份（$before 字节）"
            rm -f "$bin.upx"
          fi
          echo "$summary"
          echo "- ${{ matrix.rid }}：$summary，最终 $(wc -c < "$bin") 字节" >> "$GITHUB_STEP_SUMMARY"

      # **只 stage 可执行文件本身**，名字带平台与架构（Release 上看得懂）。
      - name: Stage asset (only the executable)
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release-dist/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "dist/${{ matrix.asset }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload staged asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.rid }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # 两层门槛：① `publish` 关掉就整条跳过（默认关）；
    # ② 这里不需要 `!failure()`——四个目标都跑，任一红就不该发。
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag when publishing
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "publish=true 必须给 tag"; exit 1
          fi

      # `gh release` 要本地仓库（它拿 remote 拼 API 地址），所以这一步必须 checkout；
      # 少了它整条 release 步骤报 "no git remote"（本项目以前踩过，见 QODER.md CI 那条）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          # 只收这四份 exe（每条腿一个 `asset-<rid>`），别的 artifact（Cargo.lock 那类）不混进来。
          pattern: asset-*
          path: release-files
          merge-multiple: true

      - name: Checksums and manifest
        shell: bash
        run: |
          ls -l release-files
          # 四条腿都在（少一份就是矩阵少跑了一条，那种情况不该发出去）。
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -ge 4
          (cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # 标签指向哪要先查清楚：v0.1.0 那次踩过"标签已在别的提交上，create 失败后回退 upload，
      # 产物换了新的、标题与说明却还是旧内容"（抄自 `ref/ocfree/workflows/cd.yml` 的这段）。
      # 不一致就明确失败，除非勾了 `replace_tag`。
      - name: Check where the tag points
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPLACE: ${{ inputs.replace_tag }}
        run: |
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq '.object | "\(.type):\(.sha)"' 2>/dev/null || true)
          case "${obj%%:*}" in
            commit) sha="${obj#*:}" ;;
            tag) sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${obj#*:}" --jq .object.sha) ;;
            *) sha="" ;;
          esac
          if [ -z "$sha" ]; then
            echo "标签 $TAG 不存在，本次新建。"
          elif [ "$sha" = "$GITHUB_SHA" ]; then
            echo "标签 $TAG 已指向本次提交。"
          elif [ "$REPLACE" = "true" ]; then
            echo "标签 $TAG 指向 ${sha:0:7}，按 replace_tag 删旧 release 与标签后重建。"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          else
            {
              echo "## 标签已存在且不在本次提交"
              echo ""
              echo "- \`$TAG\` → \`${sha:0:7}\`"
              echo "- 本次构建 → \`${GITHUB_SHA:0:7}\`"
              echo ""
              echo "直接发布会把产物挂在旧提交名下、说明也不刷新。"
              echo "勾 \`replace_tag\` 重跑可删旧重建，或者换新版本号。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$TAG 指向 ${sha:0:7} 而非本次提交；要覆盖请勾 replace_tag 或换版本号。"
            exit 1
          fi

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "rustBiliPC（Rust + GPUI 的 Bilibili 桌面客户端）。"
            echo
            echo '每个资产都是**单个可执行文件**，不带 dll、不带 mpv——'
            echo '播放用的是外置 mpv（放在 PATH 里，或在设置页指给它）。'
            echo
            echo '登录凭据与设置写在 `%APPDATA%/ArrowMeo/rustBiliPC`（Linux 是 `~/.config/ArrowMeo/rustBiliPC`）。'
            echo
            echo '经 UPX 压缩的 exe 容易被杀软误报，遇到拦截请加白名单。校验和见 `SHA256SUMS.txt`。'
            echo
            echo "构建提交：\`${GITHUB_SHA::7}\`"
          } > notes.md
          cat notes.md

      - name: Create or fix up the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--title "rustBiliPC $TAG" --target "$GITHUB_SHA" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}" release-files/* 2>/tmp/create.err; then
            # 同 tag 重跑时 create 会失败，改成覆盖上传，避免手动删 release。
            cat /tmp/create.err
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release-files/* --clobber
          fi
          # create 成功时 edit 是无害的自我覆盖；走 upload 回退时这一步才把标题、说明、指向提交纠正过来。
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "rustBiliPC $TAG" --target "$GITHUB_SHA" --notes-file notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,targetCommitish,publishedAt,url,assets \
            --jq '"\(.tagName) → \(.targetCommitish[0:7])  \(.publishedAt)  \(.url)  \([.assets[].name] | join(", "))"' | tee -a "$GITHUB_STEP_SUMMARY"
