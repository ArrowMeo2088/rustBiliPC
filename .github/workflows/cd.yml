name: CD

# 手动触发的**发布**流水线：多平台 + `release-dist`（LTO / codegen-units=1 / strip）
# + UPX 压缩 + 发 GitHub Release。
# 2026-10-26（P13）与 `ci.yml` 分工：那条管"推的东西还能不能编过、测试是不是全绿"，
# 这条管"给人下载的产物"。**只打包 exe**——不塞 dll、不塞 mpv、不塞 README
# （用户定稿："注意只需要打包 exe，不要打包其他东西"；本项目本来就是单 exe + 外置 mpv.exe）。
#
# 结构：四个静态作业，每条腿调同一份 `.github/workflows/build-exe.yml`（步骤只有一份）。
# 为什么不用矩阵 + `fromJson` 的动态目标表：**那条路实测不通**（第五十二轮连踩两次，
# `build` 作业凭空消失、run 红、日志零错误；`include` 不能来自表达式，矩阵值也不能是对象）。
# 现在挑目标靠作业级 `if` 判 `targets`，没选中的那条就是干净的 `skipped`。
#
# `publish` 默认关：**先量 `release-dist` + UPX 的真实体积，不建 Release**（发 Release 是公开动作）。
# 四个目标里只有 win-x64 是 `ci.yml` 天天在跑的，另三条一次都没真跑过
# （runner 标签、系统库齐不齐都没证据 —— 风险清单第 31 条）。跑完把结论回填第 2 节与风险清单。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "编哪个目标（先挑一条把流水线跑通，再选 all）"
        type: choice
        required: true
        default: "win-x64"
        options:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - all
          - probe
      publish:
        description: "把这些 exe 发成 GitHub Release（关掉 = 只编译取产物，不动 Release）"
        type: boolean
        required: false
        default: false
      tag:
        description: "Release 的 tag（比如 v0.1.0），publish=true 时必填"
        type: string
        required: false
        default: "v0.1.0"
      prerelease:
        description: "标成预发布（prerelease）"
        type: boolean
        required: false
        default: true
      upx:
        description: "用 UPX 压缩（--lzma --best）"
        type: boolean
        required: false
        default: true

# `contents: write` 是 `release` 作业要的（建 release、传资产）；四个 build 作业用不到写权限，
# 但 workflow 级的 `secrets: inherit` 会把这份带下去，所以调用侧再显式收紧不如在这里说清。
permissions:
  contents: write

jobs:
  win-x64:
    if: ${{ inputs.targets == 'all' || inputs.targets == 'win-x64' }}
    uses: ./.github/workflows/build-exe.yml
    with:
      name: win-x64
      os: windows-latest
      target: x86_64-pc-windows-msvc
      exe: rustbilipc.exe
      asset: rustbilipc-win-x64.exe
      windows: "true"
      nasm: "true"
      upx: ${{ inputs.upx }}

  win-arm64:
    if: ${{ inputs.targets == 'all' || inputs.targets == 'win-arm64' }}
    uses: ./.github/workflows/build-exe.yml
    with:
      name: win-arm64
      os: windows-latest
      target: aarch64-pc-windows-msvc
      exe: rustbilipc.exe
      asset: rustbilipc-win-arm64.exe
      windows: "true"
      nasm: "true"
      upx: ${{ inputs.upx }}

  linux-x64:
    if: ${{ inputs.targets == 'all' || inputs.targets == 'linux-x64' }}
    uses: ./.github/workflows/build-exe.yml
    with:
      name: linux-x64
      os: ubuntu-latest
      target: x86_64-unknown-linux-gnu
      exe: rustbilipc
      asset: rustbilipc-linux-x64
      windows: "false"
      nasm: "false"
      upx: ${{ inputs.upx }}

  # 为什么用 arm runner 而不是在 x86 runner 上交叉编译：gpui 的 Linux 后端要链接一串系统库
  # （X11/wayland/fontconfig/ALSA/vulkan），交叉编译得先搭一个带这些 .so 与头文件的 arm64 sysroot，
  # 比直接用 arm runner 贵得多。`ubuntu-24.04-arm` 这个标签是否存在**也还没验过**。
  linux-arm64:
    if: ${{ inputs.targets == 'all' || inputs.targets == 'linux-arm64' }}
    uses: ./.github/workflows/build-exe.yml
    with:
      name: linux-arm64
      os: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      exe: rustbilipc
      asset: rustbilipc-linux-arm64
      windows: "false"
      nasm: "false"
      upx: ${{ inputs.upx }}

  # ─────────────────────────────────────────────────────────────────────────────
  # **临时探针（第五十二轮）**：`targets=probe` 时才跑，四个 echo 作业，一条 ubuntu 几秒钟。
  # 要判的事很具体：那三次红里 `build` 作业**根本不存在**（run 红、日志零错误），
  # 到底是"动态矩阵不支持"还是"我某处写法有问题"。官方 `workflow-syntax.md` 第 1294 行
  # 明确写着矩阵的某个维度**可以是对象数组**，所以我先前那条"值只能是标量"是错的归纳。
  # 判据不是日志而是**作业列表里出现几条腿**：某形状完全没出现＝那条形状在这份文件里就是展开不出来。
  # p-static 是对照组（纯静态 include），如果连它都不出现，问题就不在 fromJson。
  # 结论拿到后这一整段删掉。
  # ─────────────────────────────────────────────────────────────────────────────
  p-plan:
    if: ${{ inputs.targets == 'probe' }}
    runs-on: ubuntu-latest
    outputs:
      arr: ${{ steps.m.outputs.arr }}
      obj: ${{ steps.m.outputs.obj }}
    steps:
      - id: m
        shell: bash
        run: |
          echo 'arr=[{"name":"A","os":"ubuntu-latest"},{"name":"B","os":"ubuntu-latest"}]' >> "$GITHUB_OUTPUT"
          echo 'obj={"include":[{"name":"C","os":"ubuntu-latest"},{"name":"D","os":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT"

  p-static:
    if: ${{ inputs.targets == 'probe' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: S1
            os: ubuntu-latest
          - name: S2
            os: ubuntu-latest
    steps:
      - run: echo "对照组 p-static 出现了：${{ toJSON(matrix) }}"

  p-inc:
    if: ${{ inputs.targets == 'probe' }}
    needs: p-plan
    name: p-inc-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.p-plan.outputs.arr) }}
    steps:
      - run: echo "include 来自表达式：${{ toJSON(matrix) }}"

  p-whole:
    if: ${{ inputs.targets == 'probe' }}
    needs: p-plan
    name: p-whole-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJson(needs.p-plan.outputs.obj) }}
    steps:
      - run: echo "整份 matrix 对象来自表达式：${{ toJSON(matrix) }}"

  p-obj-legs:
    if: ${{ inputs.targets == 'probe' }}
    needs: p-plan
    name: p-obj-legs-${{ matrix.leg.name }}
    runs-on: ${{ matrix.leg.os }}
    strategy:
      matrix:
        leg: ${{ fromJson(needs.p-plan.outputs.arr) }}
    steps:
      - run: echo "对象数组当一维：${{ toJSON(matrix.leg) }}"

  release:
    needs: [win-x64, win-arm64, linux-x64, linux-arm64]
    # 两层门槛：① `publish` 关掉就整个跳过（默认关）；
    # ② `!failure() && !cancelled()` —— 默认的 `success()` 会因为"有 needs 是 skipped"而连带跳过，
    # 而只挑一条腿时另外三条**必然**是 skipped，那样 `targets=win-x64 + publish=true` 就永远发不出去。
    if: ${{ inputs.publish && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag when publishing
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "publish=true 必须给 tag"; exit 1
          fi

      # `gh release` 要本地仓库（它拿 remote 拼 API 地址），所以这一步必须 checkout；
      # 少了它整条 release 步骤报 "no git remote"（本项目以前踩过，见 QODER.md CI 那条）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          # 只收这次真跑过的那几条 exe（每条腿一个 `asset-<name>`），别的 artifact 不混进来。
          pattern: asset-*
          path: release-files
          merge-multiple: true

      - name: Show what will be published
        run: ls -l release-files

      - name: Create or refresh the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -e
          notes="rustBiliPC（Rust + GPUI 的 Bilibili 桌面客户端）。"
          notes="$notes 每个资产都是**单个可执行文件**，不带 dll、不带 mpv——"
          notes="$notes 播放用的是外置 mpv（放在 PATH 里，或在设置页指给它）。"
          notes="$notes 登录凭据与设置写在 %APPDATA%/ArrowMeo/rustBiliPC（Linux 是 ~/.config/ArrowMeo/rustBiliPC）。"
          notes="$notes 经过 UPX 压缩的 exe 容易被杀软误报，遇到拦截请加白名单。"
          # 同 tag 重跑时只 `--clobber` 同名文件：改名或减少目标会留下上一轮的孤儿资产，
          # 所以真要清干净请先把 release 删掉再跑。
          if gh release view "$TAG" >/dev/null 2>&1; then
            for f in release-files/*; do
              gh release upload "$TAG" "$f" --clobber
            done
          else
            args=(release-files/* --title "$TAG" --notes "$notes")
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi
          echo "### 发布内容" >> "$GITHUB_STEP_SUMMARY"
          ls -l release-files >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json tagName,assets,url >> "$GITHUB_STEP_SUMMARY"
